<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gorilla Sandbox Engine</title>
  
  <!-- Core Framework & Standard Physics Only -->
  <script src="https://aframe.io"></script>
  <script src="https://jsdelivr.net"></script>

  <script>
    // ==========================================
    // 1. LOCOMOTION (Gorilla Tag Physics)
    // ==========================================
    AFRAME.registerComponent('gorilla-hand', {
      init: function () {
        this.prevPos = new THREE.Vector3();
        this.handVel = new THREE.Vector3();
        this.playerRig = document.getElementById('player');
        
        this.el.addEventListener('collide', (e) => {
          if (e.detail.body.el.id === 'floor' && this.playerRig.body) {
            let impulse = new CANNON.Vec3(
              -this.handVel.x * 2.8,
              -this.handVel.y * 3.8, 
              -this.handVel.z * 2.8
            );
            this.playerRig.body.applyImpulse(impulse, this.playerRig.body.position);
          }
        });
      },
      tick: function () {
        let currentPos = this.el.object3D.position;
        this.handVel.copy(currentPos).sub(this.prevPos).multiplyScalar(100);
        this.prevPos.copy(currentPos);
      }
    });

    // ==========================================
    // 2. SANDBOX MENU & SPAWNER
    // ==========================================
    AFRAME.registerComponent('sandbox-spawner', {
      init: function () {
        this.items = ['box', 'sphere', 'ragdoll-target'];
        this.activeIdx = 0;

        this.el.addEventListener('triggerdown', () => this.spawn());
        this.el.addEventListener('gripdown', () => {
          this.activeIdx = (this.activeIdx + 1) % this.items.length;
          console.log(`Selected item: ${this.items[this.activeIdx]}`);
        });
      },
      spawn: function () {
        let scene = this.el.sceneEl;
        let worldPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(worldPos);
        
        let entity = document.createElement('a-entity');
        let choice = this.items[this.activeIdx];

        if (choice === 'box') {
          entity.setAttribute('geometry', 'primitive: box; width: 0.5; height: 0.5; depth: 0.5');
          entity.setAttribute('material', 'color: #ff3366');
          entity.setAttribute('dynamic-body', 'mass: 5');
        } else if (choice === 'sphere') {
          entity.setAttribute('geometry', 'primitive: sphere; radius: 0.3');
          entity.setAttribute('material', 'color: #33fff3');
          entity.setAttribute('dynamic-body', 'mass: 3');
        } else if (choice === 'ragdoll-target') {
          entity.setAttribute('geometry', 'primitive: cylinder; radius: 0.4; height: 1.4');
          entity.setAttribute('material', 'color: #5c4033');
          entity.setAttribute('dynamic-body', 'mass: 12');
          entity.setAttribute('class', 'dummy');
        }

        entity.setAttribute('position', `${worldPos.x} ${worldPos.y} ${worldPos.z - 0.5}`);
        scene.appendChild(entity);
      }
    });

    // ==========================================
    // 3. COMBAT DAGGERS
    // ==========================================
    AFRAME.registerComponent('dagger', {
      init: function () {
        this.el.addEventListener('collide', (e) => {
          let hitObject = e.detail.body.el;
          if (hitObject && hitObject.classList.contains('dummy')) {
            // Log target impact for test validation
            console.log("Target dummy stabbed successfully!");
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- Single Player Stable Scene -->
  <a-scene physics="gravity: -9.8;">
    
    <!-- Environment Platforms -->
    <a-plane id="floor" static-body rotation="-90 0 0" width="2000" height="2000" material="color: #222; roughness: 1; metalness: 0"></a-plane>
    <a-sky color="#0a0a0f"></a-sky>
    <a-light type="ambient" color="#999"></a-light>
    <a-light type="directional" color="#fff" intensity="0.5" position="1 3 1"></a-light>

    <!-- Player Character Setup -->
    
      
      

      <!-- Left Controller -->
      

      <!-- Right Controller -->
      
        
      

    

  </a-scene>
</body>
</html>
